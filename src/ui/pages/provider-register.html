<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Registration - Appoint</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="/" class="logo">Appoint</a>
      <nav class="nav">
        <a href="/provider/register">Register</a>
        <a href="/provider/dashboard">Dashboard</a>
      </nav>
    </div>
  </header>
  <main class="main">
    <div class="container">
      <h1>Provider Registration</h1>
      <div class="card">
        <form id="registration-form" onsubmit="handleRegistration(event)">
          <div class="form-group">
            <label class="form-label">Provider Type</label>
            <select id="type" class="form-input" required>
              <option value="">Select type</option>
              <option value="doctor">Doctor</option>
              <option value="hospital">Hospital</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-input" placeholder="Dr. Smith" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="dr.smith@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone (optional)</label>
            <input type="tel" id="phone" class="form-input" placeholder="+1234567890">
          </div>
          <div class="form-group">
            <label class="form-label">Timezone</label>
            <select id="timezone" class="form-input" required>
              <option value="UTC">UTC</option>
              <option value="America/New_York">Eastern Time</option>
              <option value="America/Chicago">Central Time</option>
              <option value="America/Denver">Mountain Time</option>
              <option value="America/Los_Angeles">Pacific Time</option>
              <option value="Europe/London">London</option>
              <option value="Europe/Paris">Paris</option>
              <option value="Asia/Tokyo">Tokyo</option>
              <option value="Asia/Kolkata">India</option>
            </select>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script>
    async function handleRegistration(event) {
      event.preventDefault();

      const formData = {
        type: document.getElementById('type').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value || null,
        timezone: document.getElementById('timezone').value,
      };

      try {
        const response = await fetch('/api/providers/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${getFirebaseToken()}`,
          },
          body: JSON.stringify(formData),
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Registration failed');
        }

        const provider = await response.json();
        alert('Registration successful! Your provider ID: ' + provider.id);
        window.location.href = '/provider/dashboard?provider_id=' + provider.id;
      } catch (error) {
        console.error('Registration error:', error);
        alert('Registration failed: ' + error.message);
      }
    }

    function getFirebaseToken() {
      return localStorage.getItem('firebase_token') || '';
    }
  </script>
</body>
</html>
